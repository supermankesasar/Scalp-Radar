name: Offline regression tests
on:
  pull_request:
  push:
    branches: [feature/v05-data-backtest-oneclick]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q app.py signals.py research_engine.py indicator_settings.py test_*.py
      - name: Check browser JavaScript syntax
        run: node --check coin_logos.js && node --check ui.js && node --check indicator_ui.js && node test_coin_logos.cjs
      - name: Run offline tests
        env:
          RESEARCH_AUTO: '0'
          SCANNER_BACKGROUND: '0'
        run: python -m unittest discover -p "test_*.py" -v
