name: P0 recovery regression
on:
  pull_request:
    paths:
      - p0_recovery.py
      - tests/test_p0_recovery.py
      - database_location.py
      - .github/workflows/p0-recovery.yml
  workflow_dispatch:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_p0_recovery.py -v
